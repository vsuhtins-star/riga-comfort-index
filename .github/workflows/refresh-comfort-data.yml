name: Refresh prepared comfort dataset

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 04:30 UTC.
    - cron: "30 4 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-comfort-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static OpenStreetMap snapshot
        run: python scripts/build_comfort_data.py

      - name: Commit updated dataset when it changed
        run: |
          git add data/comfort-features.geojson
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update prepared comfort dataset"
            git push
          else
            echo "Prepared dataset is unchanged; nothing to commit."
          fi
